[project]
name = "helio"
version = "0.1.0"
description = "Detector de sonolência e distrações para automóveis."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "opencv-python",
    "mediapipe",
    "scipy",
    "numpy",
    "boto3",
    "types-boto3>=1.43.19",
    "botocore[crt]",
    "onnxruntime>=1.20",
]

[dependency-groups]
dev = ["pytest>=8", "onnx>=1.17"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
